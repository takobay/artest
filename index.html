<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チバ・シティ // 室内電脳レイヤー</title>
    
    <!-- A-Frame 最新版の読み込み（WebXR対応） -->
    <script src="https://aframe.io"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        #hud {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
            color: #00ffff; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #00ffff;
            font-size: 11px; border-radius: 4px; pointer-events: none; text-align: center;
        }
    </style>
</head>
<body>

    <div id="hud">
        [ROOM SCANNING] 周囲の壁や床にカメラをゆっくり向けてください...
    </div>

    <!-- 
        WebXRの空間認識（optionalFeatures: planes）を有効化。
        これにより、ブラウザに「部屋の平面を検出してくれ」と頼みます。
    -->
    <a-scene webxr="optionalFeatures: planes, local-floor;">
        
        <!-- 
            【部屋の検出面にグリッドを貼る設定】
            A-Frameが自動で検知した床や壁（ar-hit-testや平面オブジェクト）に対して、
            wireframe: true の水色発光素材を適用します。
        -->
        
        

        <!-- 検出された床や壁の代わりに仮配置するグリッドプレーンの定義 -->
        <a-plane id="grid-preview" 
                 rotation="-90 0 0" 
                 width="10" height="10" 
                 material="color: #00ffff; wireframe: true; wireframeLinewidth: 3; emissive: #00ffff; emissiveIntensity: 0.8; opacity: 0.7;">
        </a-plane>

        <!-- サイバーパンクな文字も空間に固定 -->
        <a-text value="SCANNING INTERNAL MATRIX" 
                position="0 1.5 -2" 
                align="center" 
                color="#ff007f" 
                width="4"
                material="emissive: #ff007f;">
        </a-text>

        
    </a-scene>

</body>
</html>
